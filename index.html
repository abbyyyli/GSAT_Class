<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>學測英文｜課後筆記</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&family=Noto+Sans+TC:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d1728;--panel:#17263f;--panel-2:#1c304c;--edge:#2c4361;--edge-2:#3e5a7c;
  --ink:#e8f1fc;--muted:#9fb2cb;--dim:#6c819e;
  --amber:#f9bd58;--amber-soft:#f9bd5822;--blue:#65bfff;--green:#83e1b9;--green-soft:#83e1b91f;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font:15px/1.7 "Noto Sans TC","Inter",sans-serif;min-height:100vh;
  background-image:radial-gradient(ellipse 80% 50% at 50% -10%,#1f3a63 0%,transparent 70%)}
a{color:inherit;text-decoration:none}
.wrap{max-width:760px;margin:0 auto;padding:0 18px}

/* Header */
header{padding:56px 0 34px}
.eyebrow{font:700 12px Inter,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--amber)}
h1{font-size:clamp(30px,6vw,42px);font-weight:800;line-height:1.25;margin:8px 0 6px;letter-spacing:.02em}
.sub{color:var(--muted)}
.progress{margin-top:26px;display:flex;align-items:center;gap:16px}
.progress-bar{flex:1;height:8px;border-radius:99px;background:#22344f;overflow:hidden}
.progress-bar>div{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--green),#5fd0a2)}
.progress-text{font:700 14px Inter,sans-serif;color:var(--muted);white-space:nowrap}
.progress-text b{color:var(--ink);font-size:18px}

/* Section title */
.label{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.08em;margin:0 0 12px;display:flex;align-items:center;gap:10px}
.label::after{content:"";flex:1;height:1px;background:var(--edge)}

/* Featured (current) lesson */
.feature{display:block;position:relative;background:linear-gradient(135deg,#1d3352 0%,#17263f 100%);
  border:1px solid var(--edge-2);border-radius:18px;padding:26px 26px 22px;margin-bottom:38px;overflow:hidden;
  transition:border-color .2s,transform .2s,box-shadow .2s}
.feature::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--amber)}
.feature:hover{border-color:var(--amber);transform:translateY(-2px);box-shadow:0 10px 30px #0006}
.feature .tag{display:inline-block;background:var(--amber);color:#15243a;font-weight:800;font-size:12px;padding:3px 11px;border-radius:99px}
.feature .num{font:800 13px Inter,sans-serif;color:var(--muted);letter-spacing:.1em;margin-left:10px}
.feature h2{font-size:22px;line-height:1.45;margin:14px 0 4px}
.feature p{color:var(--muted);font-size:14px}
.feature .go{display:inline-flex;align-items:center;gap:8px;margin-top:18px;font-weight:700;color:var(--amber)}
.feature .go svg{transition:transform .2s}
.feature:hover .go svg{transform:translateX(4px)}

/* Lesson list */
.list{display:flex;flex-direction:column;gap:8px;margin-bottom:56px}
.row{display:flex;align-items:center;gap:16px;padding:15px 18px;border-radius:13px;border:1px solid var(--edge);background:var(--panel);transition:border-color .2s,background .2s}
a.row:hover{border-color:var(--blue);background:var(--panel-2)}
a.row:focus-visible,.feature:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
.row .idx{flex:0 0 42px;height:42px;border-radius:11px;display:grid;place-items:center;font:800 15px Inter,sans-serif;background:#22344f;color:var(--muted)}
.row .body{flex:1;min-width:0}
.row .title{font-weight:700;line-height:1.45}
.row .meta{font-size:13px;color:var(--muted)}
.row .status{flex:0 0 auto;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;white-space:nowrap}
.row.done .idx{background:var(--green-soft);color:var(--green)}
.row.done .status{background:var(--green-soft);color:var(--green)}
.row.current{border-color:#f9bd5866}
.row.current .idx{background:var(--amber-soft);color:var(--amber)}
.row.current .status{background:var(--amber-soft);color:var(--amber)}
.row.locked{background:transparent;border-style:dashed;opacity:.6}
.row.locked .title{color:var(--dim);font-weight:500}
.row.locked .status{color:var(--dim)}
.arrow{flex:0 0 auto;color:var(--dim);transition:color .2s,transform .2s}
a.row:hover .arrow{color:var(--blue);transform:translateX(3px)}

footer{border-top:1px solid var(--edge);padding:22px 0 36px;text-align:center;font-size:12px;color:var(--dim)}

@media(max-width:560px){
  header{padding:40px 0 26px}
  .feature{padding:22px 20px 18px}
  .feature h2{font-size:19px}
  .row{gap:12px;padding:13px 14px}
  .row .idx{flex-basis:38px;height:38px;font-size:14px}
  .arrow{display:none}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">GSAT English · Student Review</div>
    <h1>學測英文課後筆記</h1>
    <p class="sub">依課次複習單字、題目與解析</p>
    <div class="progress" aria-label="課程進度">
      <div class="progress-bar"><div id="bar"></div></div>
      <div class="progress-text"><b id="doneCount">0</b> / <span id="totalCount">0</span> 課</div>
    </div>
  </header>

  <main>
    <div class="label">本週進度</div>
    <div id="feature"></div>
    <div class="label">課程目錄</div>
    <nav class="list" id="list" aria-label="課程目錄"></nav>
  </main>

  <footer>GSAT English · 學測英文課後複習</footer>
</div>

<script>
/* 新增課程時只需修改這份清單：status 可為 done、current 或 locked */
const lessons = [
  { n: 1, title: "111 學測英文模擬試卷", range: "詞彙題 1–5",  href: "GSAT-Lesson01-Student.html", status: "done" },
  { n: 2, title: "111 學測英文模擬試卷", range: "詞彙題 6–10", href: "GSAT-Lesson02-Student.html", status: "done" },
  { n: 3, title: "111 學測英文模擬試卷", range: "綜合測驗 11–15", href: "GSAT-Lesson03-Student.html", status: "current" },
  { n: 4, status: "locked" },
  { n: 5, status: "locked" },
  { n: 6, status: "locked" },
  { n: 7, status: "locked" },
  { n: 8, status: "locked" },
  { n: 9, status: "locked" }
];

const pad = n => String(n).padStart(2, "0");
const statusText = { done: "已完成", current: "本週", locked: "尚未開放" };
const arrow = '<svg class="arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';

const open = lessons.filter(l => l.status !== "locked");
const done = lessons.filter(l => l.status === "done").length;
document.getElementById("doneCount").textContent = done;
document.getElementById("totalCount").textContent = lessons.length;
document.getElementById("bar").style.width = (done / lessons.length * 100) + "%";

const cur = lessons.find(l => l.status === "current") || open[open.length - 1];
if (cur) {
  document.getElementById("feature").innerHTML =
    '<a class="feature" href="' + cur.href + '">' +
      '<span class="tag">本週課程</span><span class="num">LESSON ' + pad(cur.n) + '</span>' +
      '<h2>' + cur.title + '</h2><p>' + cur.range + '</p>' +
      '<span class="go">開始複習 <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>' +
    '</a>';
}

document.getElementById("list").innerHTML = lessons.map(l => {
  const inner =
    '<div class="idx">' + pad(l.n) + '</div>' +
    '<div class="body">' +
      '<div class="title">' + (l.title ? l.range : "待加入") + '</div>' +
      (l.title ? '<div class="meta">Lesson ' + pad(l.n) + '・' + l.title + '</div>' : '') +
    '</div>' +
    '<span class="status">' + statusText[l.status] + '</span>';
  return l.status === "locked"
    ? '<div class="row locked" aria-disabled="true">' + inner + '</div>'
    : '<a class="row ' + l.status + '" href="' + l.href + '">' + inner + arrow + '</a>';
}).join("");
</script>
</body>
</html>
