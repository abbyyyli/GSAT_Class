<script>
const DATA={"vocab":{"words":[{"tag":"Q6","w":"dispute","pos":"n.","zh":"爭端；爭執","col":"settle a dispute","colZh":"解決爭端","ex":"The teacher helped the two students settle their dispute calmly.","exZh":"老師幫兩位同學冷靜地化解了爭執。"},{"tag":"Q6","w":"judgment","pos":"n.","zh":"判斷；判斷力","col":"make a judgment","colZh":"下判斷","ex":"Don't make a judgment before you know the whole story.","exZh":"在了解事情全貌之前，不要輕易下判斷。"},{"tag":"Q6","w":"priority","pos":"n.","zh":"優先事項","col":"top priority","colZh":"首要之事","ex":"Before the exam, my top priority is to review the words I often get wrong.","exZh":"考試前，我的首要任務是複習常錯的單字。"},{"tag":"Q6","w":"viewpoint","pos":"n.","zh":"觀點","col":"from my viewpoint","colZh":"從我的觀點來看","ex":"From my viewpoint, students need more time to sleep.","exZh":"從我的觀點來看，學生需要更多睡眠時間。"},{"tag":"Q7","w":"sentiment","pos":"n.","zh":"感受；看法","col":"share the sentiment that ...","colZh":"認同……的看法","ex":"Many students share the sentiment that there is too much homework.","exZh":"許多學生都認同作業太多的看法。"},{"tag":"Q7","w":"profile","pos":"n.","zh":"個人檔案；簡介","col":"a social media profile","colZh":"社群媒體個人檔案","ex":"Think twice before you share personal information on your social media profile.","exZh":"在社群媒體個人檔案上分享個人資料前要三思。"},{"tag":"Q7","w":"terminal","pos":"n.","zh":"航廈；終端機","col":"an airport terminal","colZh":"機場航廈","ex":"Our flight leaves from Terminal 2, so we need to take the shuttle bus.","exZh":"我們的班機從第二航廈出發，所以要搭接駁車。"},{"tag":"Q7","w":"tribute","pos":"n.","zh":"敬意；致敬","col":"pay tribute to","colZh":"向……致敬","ex":"The students sang a song to pay tribute to their retiring teacher.","exZh":"學生們唱了一首歌，向即將退休的老師致敬。"},{"tag":"Q8","w":"eventually","pos":"adv.","zh":"最後；終於","col":"eventually succeed","colZh":"最後成功","ex":"After failing three times, he eventually passed the driving test.","exZh":"失敗三次後，他終於通過了駕照考試。"},{"tag":"Q8","w":"realistically","pos":"adv.","zh":"實際地；務實地","col":"realistically speaking","colZh":"實際來說","ex":"Realistically speaking, we cannot finish this project in one day.","exZh":"實際來說，我們不可能一天做完這份專題。"},{"tag":"Q8","w":"practically","pos":"adv.","zh":"幾乎；實際上","col":"practically impossible","colZh":"幾乎不可能","ex":"Without a map, it is practically impossible to find the way out.","exZh":"沒有地圖，幾乎不可能找到出路。"},{"tag":"Q8","w":"relatively","pos":"adv.","zh":"相對地；比較而言","col":"relatively optimistic","colZh":"相對樂觀","ex":"Compared with other cities, Tainan is relatively warm in winter.","exZh":"和其他城市相比，台南的冬天相對溫暖。"},{"tag":"Q9","w":"suspend","pos":"v.","zh":"暫停；使停職","col":"be suspended because of a typhoon","colZh":"因颱風而暫停（停課）","ex":"Classes were suspended because of the typhoon, so we stayed at home.","exZh":"因為颱風停課，所以我們待在家裡。"},{"tag":"Q9","w":"confess","pos":"v.","zh":"坦承；招認","col":"confess to + N / V-ing","colZh":"坦承某事／坦承做了某事","ex":"He finally confessed to breaking the window.","exZh":"他終於坦承打破了窗戶。"},{"tag":"Q9","w":"shelter","pos":"v.","zh":"遮蔽；保護","col":"shelter ... from the rain","colZh":"為……遮雨","ex":"The old tree sheltered us from the heavy rain.","exZh":"那棵老樹為我們擋住了大雨。"},{"tag":"Q9","w":"obsessed","pos":"adj.","zh":"著迷的；沉迷的","col":"be obsessed with","colZh":"對……著迷","ex":"My brother is obsessed with online games and often stays up late.","exZh":"我弟弟沉迷於線上遊戲，常常熬夜。"},{"tag":"Q10","w":"illustrate","pos":"v.","zh":"說明；畫插圖","col":"illustrate a point","colZh":"說明論點","ex":"The teacher used a simple example to illustrate her point.","exZh":"老師用一個簡單的例子來說明她的論點。"},{"tag":"Q10","w":"identify","pos":"v.","zh":"辨認；找出","col":"identify the cause","colZh":"找出原因","ex":"We need to identify the cause of the problem before we try to solve it.","exZh":"在解決問題之前，我們必須先找出原因。"},{"tag":"Q10","w":"discharge","pos":"v.","zh":"排放；准許出院","col":"be discharged from the hospital","colZh":"出院","ex":"My grandfather was discharged from the hospital after a week.","exZh":"我爺爺住院一週後出院了。"},{"tag":"Q10","w":"concern","pos":"v.","zh":"使擔憂；與……有關","col":"concern parents","colZh":"讓家長擔憂","ex":"The rising number of traffic accidents concerns many parents.","exZh":"交通事故增加讓許多家長擔憂。"}],"keys":[{"q":6,"w":"manage","pos":"v.","zh":"管理","ex":"It is hard to manage time during exam week.","exZh":"考試週很難管理時間。"},{"q":6,"w":"clear","pos":"adj.","zh":"清楚的；明確的","ex":"The teacher gave us clear rules.","exZh":"老師給我們明確的規定。"},{"q":6,"w":"have no idea","pos":"phr.","zh":"完全不知道","ex":"I have no idea where my phone is.","exZh":"我完全不知道手機在哪裡。"},{"q":7,"w":"depressed","pos":"adj.","zh":"沮喪的；情緒低落的","ex":"He felt depressed after losing the game.","exZh":"輸了比賽後他很沮喪。"},{"q":7,"w":"regret","pos":"v.","zh":"後悔","ex":"I regret not studying harder.","exZh":"我後悔沒有更努力讀書。"},{"q":7,"w":"keep someone company","pos":"phr.","zh":"陪伴某人","ex":"I stayed home to keep my sick brother company.","exZh":"我留在家陪生病的弟弟。"},{"q":8,"w":"dilemma","pos":"n.","zh":"兩難；困境","ex":"I am in a dilemma: study or sleep?","exZh":"我陷入兩難：讀書還是睡覺？"},{"q":8,"w":"optimistic","pos":"adj.","zh":"樂觀的","ex":"Stay optimistic, and you will find a way.","exZh":"保持樂觀，你會找到辦法。"},{"q":8,"w":"in the long run","pos":"phr.","zh":"長期而言","ex":"Exercise helps you in the long run.","exZh":"長期來看，運動對你有幫助。"},{"q":9,"w":"currently","pos":"adv.","zh":"目前","ex":"She is currently living in Taipei.","exZh":"她目前住在台北。"},{"q":9,"w":"investigation","pos":"n.","zh":"調查","ex":"The police started an investigation.","exZh":"警方展開調查。"},{"q":9,"w":"innocence","pos":"n.","zh":"清白；無辜","ex":"He tried to prove his innocence.","exZh":"他試著證明自己的清白。"},{"q":10,"w":"pollution","pos":"n.","zh":"污染","ex":"Air pollution is a big problem in many cities.","exZh":"空氣污染是很多城市的大問題。"},{"q":10,"w":"resident","pos":"n.","zh":"居民","ex":"Local residents are happy about the new park.","exZh":"當地居民很高興有新公園。"},{"q":10,"w":"express","pos":"v.","zh":"表達","ex":"It is hard for me to express my feelings in English.","exZh":"我很難用英文表達感受。"}],"family":[{"root":"prior","q":6,"forms":[["prior","adj.","先前的"],["priority","n.","優先事項"],["prioritize","v.","排定優先順序"]],"note":"priority 的複數是 priorities。prior to 表示「在……之前」。"},{"root":"sentiment","q":7,"forms":[["sentiment","n.","感受；看法"],["sentimental","adj.","多愁善感的；有紀念意義的"],["sentimentally","adv.","感情上"]],"note":"sentimental value 是「紀念價值」，常用在描述舊物。"},{"root":"relate","q":8,"forms":[["relate","v.","有關；產生共鳴"],["relation","n.","關係"],["relative","n.","親戚"],["relative","adj.","相對的"],["relatively","adv.","相對地"]],"note":"relate to 可以表示「能體會」：I can relate to your feelings."},{"root":"suspend","q":9,"forms":[["suspend","v.","暫停"],["suspension","n.","暫停；停職"],["suspended","adj.","暫停的"]],"note":"名詞拼作 suspension，不是 suspendtion。"},{"root":"obsess","q":9,"forms":[["obsess","v.","使著迷"],["obsession","n.","著迷"],["obsessed","adj.","著迷的"],["obsessive","adj.","過度的；強迫性的"]],"note":"人當主詞用 be obsessed with，介系詞是 with。"},{"root":"concern","q":10,"forms":[["concern","v.","使擔憂；與……有關"],["concern","n.","擔憂"],["concerned","adj.","擔心的"],["concerning","prep.","關於"]],"note":"be concerned about 是「擔心」；be concerned with 是「與……有關」。"},{"root":"identify","q":10,"forms":[["identify","v.","辨認；找出"],["identification","n.","身分證明"],["identity","n.","身分"],["identifiable","adj.","可辨認的"]],"note":"ID card 的 ID 就是 identification 的縮寫。"},{"root":"illustrate","q":10,"forms":[["illustrate","v.","說明；畫插圖"],["illustration","n.","插圖；例證"],["illustrator","n.","插畫家"]],"note":"for illustration 表示「舉例說明」。"}],"syn":[{"concept":"優先事項","q":6,"items":[["priority","應先處理的人事物","Safety is our top priority.","安全是我們的首要考量。"],["chief concern","最受關注或最令人擔心的問題","Cost is our chief concern.","成本是我們最關心的問題。"],["first consideration","做決定時最先考慮的因素，較正式","Public safety must be our first consideration.","公共安全必須是我們的首要考量。"]]},{"concept":"觀點","q":6,"items":[["viewpoint","看待議題的立場或角度","From my viewpoint, the policy is effective.","從我的觀點來看，這項政策是有效的。"],["opinion","個人看法，最通用","In my opinion, the plan needs revision.","我認為這個計畫需要修改。"],["perspective","強調觀察事情的角度","Try to see the issue from another perspective.","試著從另一個角度看這個問題。"],["standpoint","由特定身分或立場形成的觀點","From a legal standpoint, the case is complicated.","從法律的角度來看，這個案子很複雜。"]]},{"concept":"感受","q":7,"items":[["sentiment","較正式，也可指群體對議題的態度","Public sentiment toward the policy has changed.","大眾對這項政策的看法已經改變。"],["feeling","最日常，可指情緒、感覺或直覺","I had a strange feeling about the decision.","我對這個決定有一種奇怪的感覺。"],["emotion","喜怒哀樂等明顯的心理反應","He struggled to control his emotions.","他努力控制自己的情緒。"]]},{"concept":"相對而言","q":8,"items":[["relatively","依某個比較基準而言","The task is relatively easy for experienced workers.","對有經驗的員工來說，這項工作相對容易。"],["comparatively","與另一對象相比，語氣稍正式","The second test was comparatively simple.","第二次考試比較簡單。"]]},{"concept":"暫停","q":9,"items":[["suspend","正式，暫時中止職務、資格或服務","The manager was suspended from duty.","那位經理被停職了。"],["pause","短暫停一下，之後通常會繼續","She paused the video to take notes.","她暫停影片來做筆記。"],["halt","完全停下，語氣比 pause 強","Heavy rain halted the construction work.","大雨使施工停了下來。"]]},{"concept":"使擔憂","q":10,"items":[["concern","較正式，事情作主詞直接接人","The safety issue concerns local residents.","這個安全問題讓當地居民擔憂。"],["worry","最日常的說法","The test results worried her.","檢查結果讓她很擔心。"],["trouble","強調持續造成心理負擔","The unanswered question continued to trouble him.","那個沒有答案的問題一直困擾著他。"]]}],"collo":[[6,"set clear priorities","設定明確的優先順序"],[6,"give priority to safety","優先考量安全"],[6,"prioritize important tasks","優先處理重要任務"],[7,"share someone’s sentiments","認同某人的感受"],[7,"keep someone company","陪伴某人"],[7,"spare time to help","抽出時間幫忙"],[8,"face the same dilemma","面臨相同困境"],[8,"relatively optimistic about","對……相對樂觀"],[8,"in the long run","長期而言"],[9,"be suspended from duty","被停職"],[9,"conduct an investigation","進行調查"],[9,"prove one’s innocence","證明某人清白"],[10,"concern local residents","使當地居民擔憂"],[10,"be concerned about pollution","擔心污染"],[10,"discharge waste into a river","將廢棄物排入河中"]],"essay":[["時間與學習",[["set clear priorities","設定明確的優先順序"],["give priority to safety","優先考量安全"],["prioritize important tasks","優先處理重要任務"],["spare time to help","抽出時間幫忙"]]],["人際與情感",[["share someone’s sentiments","認同某人的感受"],["keep someone company","陪伴某人"],["pay tribute to","向……致敬"]]],["困境與看法",[["face the same dilemma","面臨相同困境"],["relatively optimistic about","對……相對樂觀"],["in the long run","長期而言"],["from my viewpoint","從我的觀點來看"]]],["社會與環境",[["conduct an investigation","進行調查"],["prove one’s innocence","證明某人清白"],["identify the cause","找出原因"],["be concerned about pollution","擔心污染"],["discharge waste into a river","將廢棄物排入河中"]]]]},"drills":[{"q":6,"bank":["disputes","judgments","priorities","viewpoints"],"items":[["Getting enough sleep should be one of your ___.","priorities","睡飽應該是你的【優先事項】之一。"],["Small ___ between friends are normal; just talk it out.","disputes","朋友之間有小【爭執】很正常，說開就好。"],["Reading news from many places helps you see different ___.","viewpoints","讀不同地方的新聞能讓你看到不同的【觀點】。"],["Judges must make fair ___ in every game.","judgments","裁判每場比賽都要做出公平的【判斷】。"]]},{"q":7,"bank":["profile","sentiments","terminal","tribute"],"items":[["The bus ___ is next to the train station.","terminal","公車【總站】在火車站旁邊。"],["Her letter was full of warm ___ about her old school.","sentiments","她的信裡滿是對母校溫暖的【情感】。"],["The song was a ___ to his late grandmother.","tribute","這首歌是獻給他過世奶奶的【致敬】。"],["Please update your ___ on the school website.","profile","請更新你在學校網站上的【個人資料】。"]]},{"q":8,"bank":["eventually","practically","realistically","relatively"],"items":[["If you keep practicing, you will ___ get better at English.","eventually","只要持續練習，你【最後】英文一定會進步。"],["The new phone is ___ light, so it fits in any pocket.","relatively","這支新手機【相對】很輕，放哪個口袋都行。"],["___, we need at least two more weeks to finish the project.","Realistically","【實際來看】，我們至少還要兩週才能完成這個專案。"],["After the party, the fridge was ___ empty.","practically","派對結束後，冰箱【幾乎】空了。"]]},{"q":9,"bank":["confessed","obsessed","sheltered","suspended"],"items":[["The boy ___ that he broke the window.","confessed","那個男孩【承認】是他打破窗戶的。"],["He is ___ with online games and plays all night.","obsessed","他【著迷於】線上遊戲，整晚都在玩。"],["Two players were ___ from the team for fighting.","suspended","兩名球員因為打架被球隊【暫停資格】。"],["The old temple ___ many people during the typhoon.","sheltered","颱風時這間老廟【庇護】了許多人。"]]},{"q":10,"bank":["concern","discharge","identify","illustrate"],"items":[["Please use an example to ___ your point.","illustrate","請用一個例子來【說明】你的論點。"],["Doctors could not ___ the cause of her headache.","identify","醫生無法【找出】她頭痛的原因。"],["The rising number of car accidents is a big ___ for the city.","concern","車禍增加是這座城市很大的【擔憂】。"],["The hospital will ___ him tomorrow if he feels better.","discharge","如果他好一點，醫院明天會讓他【出院】。"]]}],"questions":[{"num":6,"sentence":"Students without a clear set of ___ in mind usually find it difficult to manage their time well because they have no idea about what is important to them.","hintZh":"心中沒有一套明確 ___ 的學生，通常很難管理好時間，因為他們不知道什麼對自己重要。","options":["disputes","judgments","priorities","viewpoints"],"answer":2,"qtype":"意思題","hints":["because 後面說，這些學生不知道什麼？","不知道「什麼最重要」，所以他們缺少的是什麼？","把四個選項放進去：「一套明確的爭議／判斷／優先順序／觀點」，哪一個和「什麼最重要」有關？"],"explain":"because 後說學生不知道什麼最重要，反推前面缺少的是「優先順序」。a clear set of priorities 是一套清楚的優先事項；priority 的複數是 priorities。","reasons":["disputes是爭議，不是時間管理的先後順序。","judgments是判斷或判斷力，題目問的是重要事項的排序。","priorities是優先事項，直接呼應what is important。","viewpoints是觀點，無法直接解釋時間管理困難。"],"trap":"學生會選 judgments（判斷）。但題目說的是「什麼最重要、先做什麼」，這是 priorities。priority 的複數是 priorities，不是 prioritys。","formula":null,"grammar":{"title":"a set of 後的複數名詞","concept":"a clear set of _____ 中，of 後通常放一組可列舉的事項；priority 的複數拼作 priorities。","rule":"set 是整組的名詞，priorities 是組內的多個優先事項。priority → priorities：子音 + y 改 ies；用 set priorities 表『設定優先順序』。","example":"She has a clear set of priorities.（她有明確的一套優先順序。）","practice":"『兩項優先事項』用 priority 的哪個形式？","answer":"two priorities。","script":"先把 a set of 圈起來，問學生它裝的是一件事還是好幾件事。這裡要把重要事項排出先後，所以填 priorities。順手在白板寫 priority → priorities，提醒拼字不是 prioritys，再讀一次 a clear set of priorities。"},"takeaway":["set priorities","設定優先順序"]},{"num":7,"sentence":"I shared her ___ after we read the letters from our depressed friend. We both regretted not sparing enough time to keep her company.","hintZh":"讀了情緒低落的朋友寫來的信之後，我和她有同樣的 ___。我們都後悔沒有多花時間陪伴朋友。","options":["sentiments","profiles","terminals","tributes"],"answer":0,"qtype":"搭配題","hints":["下一句說「我們兩個都」怎麼樣？","兩個人都後悔，代表她們有相同的什麼？","share her ___：可以「分享」的是感受，還是個人檔案、航廈、敬意？"],"explain":"We both regretted 表明兩人有相同的後悔感受；share her sentiments 表示「認同她的感受」。sentiment 在此指感受或看法，不是實際物品。","reasons":["sentiments與shared及We both regretted完整呼應。","profiles是個人簡介或輪廓，不能由後悔推出。","terminals是航廈或終端機，語意場完全不合。","tributes是敬意或致敬，通常搭配pay tribute to，文中沒有紀念情境。"],"trap":"看到 depressed（情緒低落）和 letters，學生會聯想到紀念、致敬而選 tributes。tribute 要用 pay tribute to，文中也沒有提到紀念。","formula":null,"grammar":null,"takeaway":["share someone’s sentiments","認同某人的感受"]},{"num":8,"sentence":"Compared with other people facing the same dilemma, she is ___ optimistic about her chance to succeed in the long run.","hintZh":"和其他面臨同樣困境的人相比，她對自己長期成功的機會 ___ 樂觀。","options":["eventually","realistically","practically","relatively"],"answer":3,"qtype":"意思題","hints":["句子開頭的 Compared with 是什麼意思？","「和別人相比，她比較樂觀」，空格要表達什麼意思？","四個副詞裡，哪一個是「相對地、比較而言」？"],"explain":"Compared with 已設定「和其他人相比」的基準，因此 relatively optimistic 是「相對樂觀」。relatively 修飾形容詞 optimistic，不表示她完全沒有困難。","reasons":["eventually表示最終，描述時間結果，不負責比較。","realistically表示務實地，句中沒有評估現實條件的對比。","practically可表示實際上或幾乎，不表示相對程度。","relatively表示相對地，直接呼應Compared with。"],"trap":"看到 in the long run（長期而言）會想選 eventually（最後）。但空格修飾的是 optimistic，要回應句首的 Compared with。","formula":["Compared with ..., 主詞 + be + relatively + 形容詞","和……相比，相對……",null],"grammar":{"title":"比較基準與副詞 relatively","concept":"句首 Compared with other people 建立比較基準；空格修飾 optimistic，表示『相對樂觀』時用副詞 relatively。","rule":"relative 是形容詞，relatively 是副詞；比較語境要能指出拿什麼做基準。in the long run 是時間片語，意思是長期而言，不能代替修飾 optimistic 的副詞。","example":"Compared with others, she is relatively optimistic.","practice":"『跟上週相比，價格相對低』：The price is _____ low compared with last week. 填 relative 或 relatively？","answer":"relatively。修飾形容詞 low 要用副詞。","script":"先不要看中文，請學生找 Compared with 引進誰和誰相比。再問 optimistic 是什麼詞性：形容詞。要表示『相對地』來修飾它，使用 relatively。從字族 relative 到 relatively 跨了一個詞性，放回整句檢查。"},"takeaway":["relatively optimistic","相對樂觀"]},{"num":9,"sentence":"His duty as a general manager is currently ___ until further investigation proves his innocence in the rumored scandal.","hintZh":"他的總經理職務目前被 ___，直到進一步調查證明他在傳聞醜聞中的清白為止。","options":["suspended","confessed","sheltered","obsessed"],"answer":0,"qtype":"意思題","hints":["until 後面說：要等什麼事完成？","調查還沒結束，他還沒被證明清白。他的工作「目前」會怎麼樣？","把四個字放進去：職務被「暫停／坦白／庇護／著迷」，哪一個說得通？"],"explain":"until further investigation 表示調查還在進行；在證明清白之前，經理的職務被暫停。is suspended 是被動形式，suspend 在此指暫停職務。","reasons":["suspended表示被暫停職務，與currently、until完全吻合。","confessed表示已坦白；若已承認，等待證明清白的邏輯衝突。","sheltered表示被庇護，不能自然修飾duty。","obsessed表示著迷的，通常是人be obsessed with something。"],"trap":"看到 scandal（醜聞）就以為他已經 confessed（坦白）。但句子說要等調查證明他清白，代表還沒有結論。","formula":["be suspended from + 職務／學校","被停職／被停學",null],"grammar":{"title":"被動語態與暫時停職","concept":"His duty is currently _____ 中，is 後接過去分詞，可描述『職務目前被暫停』。until further investigation 表示措施有暫時性。","rule":"be suspended from duty 表『被停職』；suspend 是動詞，suspended 是過去分詞。被動結構 be + 過去分詞，主詞是承受動作的人或職務。","example":"The company suspended the officer. → The officer was suspended from duty.","practice":"把 The school suspended the student. 改寫成以 The student 開頭的被動句。","answer":"The student was suspended by the school.","script":"先確認誰做動作、誰承受動作。調查單位暫停職務，所以人員或職務是『被停職』。is 後要接 suspended，不是把 scandal 當成已定罪的證據。請學生先說出 be + 過去分詞，再把主動句換成被動句。"},"takeaway":["be suspended from duty","被停職"]},{"num":10,"sentence":"It seemed that the issue of water pollution did not ___ local residents, as few expressed their views or worries in the town meeting.","hintZh":"水污染的問題似乎沒有 ___ 當地居民，因為在鎮民大會上很少有人表達意見或擔憂。","options":["illustrate","identify","discharge","concern"],"answer":3,"qtype":"意思題","hints":["as 後面說：在鎮民大會上，很少人表達什麼？","很少人表達擔憂，代表這個問題沒有讓居民怎麼樣？","主詞是「問題」，受詞是「居民」：問題可以「說明、辨認、排放、使擔心」居民，哪一個說得通？"],"explain":"as 後說幾乎沒人表達意見或擔憂，因此水污染問題似乎沒有使居民憂慮。concern 在此是動詞，the issue concerns residents＝這件事使居民擔心。","reasons":["illustrate是說明或圖解，issue不能在此illustrate residents。","identify是辨認，議題不會辨認居民。","discharge是排放或准許離開；應是factory discharges waste，不是issue discharges residents。","concern local residents表示使居民擔憂，後文worries直接呼應。"],"trap":"看到 water pollution 會想到 discharge（排放）。但排放廢水的是工廠，「問題」不能排放「居民」。","formula":["事情 + concern + 人 = 人 + be concerned about + 事情","某事讓某人擔心",null],"grammar":{"title":"concern 與 be concerned about 的主詞","concept":"The issue concerns local residents 意思是『這件事使居民擔憂』；把人放主詞，變成 Residents are concerned about the issue。","rule":"concern 作動詞時事情可作主詞，後面直接接受影響的人。be concerned about 後面接擔心的事；concerned 是形容詞化的過去分詞。","example":"Water pollution concerns residents. = Residents are concerned about water pollution.","practice":"把 The plan concerns local residents. 改寫成 Residents ...。","answer":"Residents are concerned about the plan.","script":"請圈原句主詞 the issue：這不是人在擔心，而是事情『使人擔心』。如果改從居民開始說，主詞就換了，句型也要改成 be concerned about。讓學生在兩句中分別畫主詞和受詞。"},"takeaway":["be concerned about","擔心……"]}],"passages":[],"groups":[{"title":"詞彙題 6–10","nums":[6,7,8,9,10]}]};
const L='ABCDEFGHIJ';
function esc(x){return String(x??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
const blank=s=>esc(s).replace(/(?:(\d+)\. )?_{3,}/g,(m,n)=>'<span class="blank">'+(n?n+'. ':'')+'____</span>');
const zh=t=>'<span class="zh">'+esc(t)+'</span>';
const zhB=t=>'<span class="zh">'+blank(t).replace(/【(.*?)】/g,'<span class="zb">____</span><b class="zk">$1</b>')+'</span>';
function showSection(section){stopAudio();for(const id of ['vocab','drill','practice']){const on=id===section;document.getElementById(id).classList.toggle('active',on);const b=document.getElementById('tab-'+id);b.classList.toggle('active',on);b.setAttribute('aria-selected',on?'true':'false')}window.scrollTo(0,0)}

let speakingButton=null,speakingUtterance=null;
function stopAudio(){if(window.speechSynthesis)speechSynthesis.cancel();if(speakingButton){speakingButton.classList.remove('speaking');speakingButton.setAttribute('aria-pressed','false')}speakingButton=null;speakingUtterance=null}
function speak(text,button){if(!('speechSynthesis' in window))return;if(speakingButton===button){stopAudio();return}stopAudio();const u=new SpeechSynthesisUtterance(text.replace(/_{2,}/g,' blank '));u.lang='en-US';u.rate=.88;const v=speechSynthesis.getVoices();u.voice=v.find(x=>x.lang==='en-US')||v.find(x=>x.lang.startsWith('en'))||null;speakingButton=button;speakingUtterance=u;button.classList.add('speaking');button.setAttribute('aria-pressed','true');const done=()=>{if(speakingUtterance===u){button.classList.remove('speaking');button.setAttribute('aria-pressed','false');speakingButton=null;speakingUtterance=null}};u.onend=done;u.onerror=done;speechSynthesis.speak(u)}

  '<p class="question-translation zh">'+blank(q.hintZh)+'</p><div class="choices'+(q.options.length>4?' wb':'')+'">'+choices+'</div>'+
  '<div class="hint-row"><button type="button" class="hint-btn" id="hb-'+q.num+'" onclick="nextHint('+q.num+')">提示（0 / '+q.hints.length+'）</button><button type="button" class="reveal-btn" id="reveal-'+q.num+'" aria-expanded="false" onclick="toggleExplain('+q.num+')">查看解析</button></div><ul class="hints" id="hints-'+q.num+'"></ul>'+
  '<div class="answer-box" id="answer-'+q.num+'"><div class="answer-status" id="status-'+q.num+'"></div><p class="picked-reason" id="picked-'+q.num+'"></p><strong>答案 '+letters[q.answer]+'：'+esc(q.options[q.answer])+'</strong><p class="explain-main">'+esc(q.explain)+'</p>'+(q.trap?'<div class="trap-line">'+esc(q.trap)+'</div>':'')+(q.formula?'<div class="formula-line"><b>'+esc(q.formula[0])+'</b>　'+esc(q.formula[1])+'</div>':'')+other+grammar+take+'</div></div>'}
function nextHint(n){const q=Q.find(x=>x.num===n),ul=document.getElementById('hints-'+n),k=ul.children.length;if(k>=q.hints.length)return;ul.insertAdjacentHTML('beforeend','<li><b>提示 '+(k+1)+'</b>'+blank(q.hints[k])+'</li>');document.getElementById('hb-'+n).textContent=k+1<q.hints.length?'提示（'+(k+1)+' / '+q.hints.length+'）':'提示已用完'}
function openExplain(n){document.getElementById('answer-'+n).classList.add('visible');const b=document.getElementById('reveal-'+n);b.textContent='收回解析';b.setAttribute('aria-expanded','true')}
function toggleExplain(n){const el=document.getElementById('answer-'+n),show=el.classList.toggle('visible'),b=document.getElementById('reveal-'+n);b.textContent=show?'收回解析':'查看解析';b.setAttribute('aria-expanded',String(show));if(show&&!state[n])document.getElementById('dot-'+n).classList.add('viewed')}
function answer(n,i){if(state[n])return;const q=Q.find(x=>x.num===n);const ok=i===q.answer;state[n]={ok};const letters=q.letters||L;
 document.querySelectorAll('#q-'+n+' .choice').forEach((el,k)=>{if(k===q.answer)el.classList.add('correct');else if(k===i)el.classList.add('wrong')});
 const dot=document.getElementById('dot-'+n);dot.classList.remove('viewed');dot.classList.add(ok?'correct':'wrong');
 const st=document.getElementById('status-'+n);st.textContent=ok?'答對了':'答錯了，你選了 '+letters[i]+' · '+q.options[i];st.classList.toggle('incorrect',!ok);
 document.getElementById('picked-'+n).textContent=ok?'':(q.reasons[i]||'');openExplain(n);updateScore();updateFinish()}
function clearQ(n){delete state[n];const c=document.getElementById('q-'+n);c.querySelectorAll('.choice').forEach(b=>b.classList.remove('correct','wrong'));c.querySelector('.answer-box').classList.remove('visible');const b=document.getElementById('reveal-'+n);b.textContent='查看解析';b.setAttribute('aria-expanded','false');document.getElementById('status-'+n).textContent='';document.getElementById('picked-'+n).textContent='';document.getElementById('hints-'+n).innerHTML='';const q=Q.find(x=>x.num===n);document.getElementById('hb-'+n).textContent='提示（0 / '+q.hints.length+'）';c.querySelectorAll('details').forEach(d=>d.open=false);document.getElementById('dot-'+n).classList.remove('correct','wrong','viewed')}
function updateScore(){const g=Object.values(state),r=g.filter(x=>x.ok).length;document.getElementById('scoreVal').textContent=g.length+' / '+Q.length;document.getElementById('accuracyVal').textContent=g.length?Math.round(r/g.length*100)+'%':'—';document.getElementById('barFill').style.width=(g.length/Q.length*100)+'%'}
function resetPractice(){stopAudio();Q.forEach(q=>clearQ(q.num));updateScore();updateFinish();document.getElementById('practice').scrollIntoView()}
function redoWrong(){stopAudio();const w=Q.filter(q=>state[q.num]&&!state[q.num].ok).map(q=>q.num);w.forEach(clearQ);updateScore();updateFinish();if(w.length)goQ(w[0])}
function goQ(n){document.getElementById('q-'+n).scrollIntoView({behavior:'smooth',block:'start'})}
function updateFinish(){const el=document.getElementById('finishCard');if(Object.keys(state).length<Q.length){el.classList.remove('visible');el.innerHTML='';return}
 const w=Q.filter(q=>!state[q.num].ok).map(q=>q.num),r=Q.length-w.length;
 el.innerHTML='<h2>本課練習完成：答對 '+r+' / '+Q.length+'</h2>'+(w.length?'<p>以下題目答錯，建議重做一次並重讀解析：</p><div class="wrong-links">'+w.map(n=>'<button type="button" onclick="goQ('+n+')">第 '+n+' 題</button>').join('')+'</div><div class="finish-actions"><button type="button" class="primary" onclick="redoWrong()">只重做錯題</button><button type="button" onclick="resetPractice()">全部重做</button></div>':'<p>全部答對。到「單字練習」把每題的句子再做一次。</p><div class="finish-actions"><button type="button" onclick="resetPractice()">全部重做</button></div>');el.classList.add('visible')}
document.getElementById('practice-root').innerHTML=DATA.groups.map(g=>'<div class="practice-group"><h2>'+esc(g.title)+'</h2>'+(g.passage?passageCard(DATA.passages.find(p=>p.id===g.passage)):'')+Q.filter(q=>g.nums.includes(q.num)).map(questionCard).join('')+'</div>').join('');
document.getElementById('progressGrid').innerHTML=Q.map(q=>'<button type="button" class="progress-dot" id="dot-'+q.num+'" aria-label="前往第 '+q.num+' 題" onclick="goQ('+q.num+')">'+q.num+'</button>').join('');
updateScore();
</script>
</body></html>
