ice": "把 They devise a method. 改成現在完成式。", "answer": "They have devised a method.", "script": "先找 experts have，再問 have 後的動詞該長什麼樣子：過去分詞。四個選項都是看似可以放進句子的動詞時，第二步還要檢查受詞 an alternative。想出方案是 devise an alternative；請學生把 devise 改成 devised，讀出整個完成式。"}, "takeaway": ["devise a plan", "想出一個計畫"]}, {"num": 12, "sentence": "...the organic materials release gases such as methane and carbon dioxide, both of ___ can be burned to generate enough electricity...", "hintZh": "氣體，例如甲烷和二氧化碳，這兩種 ___ 都可以燃燒", "options": ["them", "those", "which", "what"], "answer": 2, "qtype": "公式題", "hints": ["找出逗號的位置。逗號前面那一段，是不是一句完整的話？", "逗號後面還有動詞 can be burned。兩句話中間只有逗號、沒有 and，要用哪種字接起來？", "哪一個字能把兩句話接起來，同時代表前面的兩種氣體？"], "explain": "逗號前是一句完整的話，逗號後的 can be burned 是第二句話。兩句之間沒有 and，要用 which 把兩句接起來，which 同時代表前面的甲烷和二氧化碳。them 和 those 沒有接句子的功能；what 不會放在逗號後面指前面的東西。", "reasons": ["them只能作代名詞，不能直接引導逗號後子句。", "those是指示代名詞，不能在此引導關係子句。", "which同時完成指代與連接功能。", "what本身包含先行詞，前面不能已有明確名詞。"], "trap": "學生最常選 them，因為中文說「它們兩個都可以燒」很自然。提醒：英文兩句話之間沒有 and，就要用 which。", "formula": ["名詞, both of which + 動詞", "……，這兩者都……", "同類：all of which（全部都）、some of which（其中一些）"], "grammar": {"title": "both of which：補充說明前面的名詞", "concept": "前句先出現 methane and carbon dioxide，逗號後的 both of which 讓讀者知道『兩者都能燃燒』。which 指回兩種氣體。", "rule": "逗號後要接關係子句時用 which 連接；both of them 只是代名詞片語，不能單獨用逗號接 can be burned 形成同一個句子。", "example": "The town has two bridges, both of which are old. = The town has two bridges. Both of them are old.", "practice": "合併兩句：There are two plans. Both of them are practical. 用 both of which。", "answer": "There are two plans, both of which are practical.", "script": "先問學生 methane 和 carbon dioxide 是幾種氣體：兩種。both 指兩種，which 把它們連回前面的名詞。寫下兩個獨立句，再用逗號加 both of which 合併，讓學生看到為什麼在原句不能只填 them。"}, "takeaway": ["both of which", "這兩者都"]}, {"num": 13, "sentence": "___ is the potential of the landfill gas that it’s recognized as an efficient and environmentally-friendly energy source by the American government.", "hintZh": "掩埋場氣體的潛力是 ___，以至於它被認可為……", "options": ["So", "S  thought in Taiwan.", "hintZh": "然而，這個想法在台灣 ___ 被好好思考。", "options": ["is supposed to", "has yet to", "might as well", "had better"], "answer": 1, "qtype": "意思題", "hints": ["However 是什麼意思？前一段說全世界的情況怎樣？", "「然而」後面會講相反的事。台灣的情況會是什麼？", "最後一句說這個計畫 worth considering（值得考慮）。台灣做了沒？"], "explain": "前面說全世界都在做，However 轉折，台灣「還沒」認真考慮，最後一句「值得考慮」也證明台灣還沒做。has yet to 是「還沒」。", "reasons": ["is supposed to只表應該或預定，未清楚表達截至目前尚未做。", "has yet to準確表示目前仍未完成。", "might as well表沒有更好選擇時不妨，主詞關係不合。", "had better表最好，不能用來客觀描述臺灣現況。"], "trap": "has yet to 裡面有 has 和 yet，學生會以為是「已經」，其實是「還沒」。", "formula": ["have / has yet to + 原形動詞", "還沒……", "= have not + 過去分詞 + yet"], "grammar": {"title": "has yet to + 原形動詞與被動", "concept": "has yet to be considered 意思是『到目前為止尚未被考慮』，等於 has not been considered yet。", "rule": "has yet to 後接原形動詞；主詞（這個構想）是被考慮的對象，所以接 be considered。否定意思來自 yet to，句中不需再加 not。", "example": "The plan has yet to be approved. = The plan has not been approved yet.", "practice": "把 The issue has not been discussed yet. 改成 has yet to。", "answer": "The issue has yet to be discussed.", "script": "先用中文說『尚未被考慮』，帶學生分清 has yet to 和 has not ... yet 是兩種說法。回到原題，主詞是被人考慮的對象，所以 to 後用 be considered。請學生把另一個被動句改寫一次。"}, "takeaway": ["has yet to be solved", "還沒被解決"]}], "passages": [{"id": "A", "title": "Landfill Gas", "label": "題組 A · 綜合測驗 11–15", "article": "<p>In a densely populated metropolis, the collective output of waste can spell disaster for both the government and the average public. While most household waste either ends up in landfills or burned up, experts in America have <span class=\"article-blank\">11. _____</span> an alternative that can turn the waste even to our advantage.</p><p>As garbage breaks down in landfills, the organic materials release gases such as methane and carbon dioxide, both of <span class=\"article-blank\">12. _____</span> can be burned to generate enough electricity to meet the needs of common families. Such projects have currently been in place in nearly every state in the U.S. except Alaska and Hawaii. <span class=\"article-blank\">13. _____</span> is the potential of the landfill gas that it’s recognized as an efficient and environmentally-friendly energy source by the American government.</p><p>In fact, similar projects are <span class=\"article-blank\">14. _____</span> worldwide. Countries like Belgium, Norway and Sweden have cooperated with local enterprises in tapping into the often detested landfills for energy and also for extra revenue. However, the idea <span class=\"article-blank\">15. _____</span> be given much thought in Taiwan. In any case, the project is certainly worth considering in view of our ever-increasing amounts of garbage.</p>", "zh": ["在人口密集的大城市裡，大家製造的大量垃圾，可能為政府和一般民眾帶來災難。大部分家庭垃圾最後不是送進掩埋場，就是被燒掉；不過，美國專家已經 11. ___ 一個替代方法，甚至能把垃圾變成對我們有利的東西。", "垃圾在掩埋場分解時，裡面的有機物質會釋放甲烷和二氧化碳等氣體，這兩種氣體 12. ___ 都可以燃燒，產生足夠一般家庭使用的電。除了阿拉斯加和夏威夷，美國幾乎每一州目前都有這類計畫。掩埋場氣體的潛力 13. ___ 大，以至於美國政府認可它是一種高效率又環保的能源。", "事實上，類似的計畫正在全世界 14. ___。比利時、挪威和瑞典等國家已經和當地企業合作，利用常被人討厭的掩埋場來取得能源，也賺取額外收入。然而，這個想法在台灣 15. ___ 被好好思考。無論如何，考慮到我們的垃圾量越來越多，這個計畫絕對值得考慮。"]}], "groups": [{"title": "綜合測驗 11–15", "passage": "A", "nums": [11, 12, 13, 14, 15]}]};
const L='ABCDEFGHIJ';
function esc(x){return String(x??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
const blank=s=>esc(s).replace(/(?:(\d+)\. )?_{3,}/g,(m,n)=>'<span class="blank">'+(n?n+'. ':'')+'____</span>');
const zh=t=>'<span class="zh">'+esc(t)+'</span>';
const zhB=t=>'<span class="zh">'+blank(t).replace(/【(.*?)】/g,'<span class="zb">____</span><b class="zk">$1</b>')+'</span>';
function showSection(section){stopAudio();for(const id of ['vocab','drill','practice']){const on=id===section;document.getElementById(id).classList.toggle('active',on);const b=document.getElementById('tab-'+id);b.classList.toggle('active',on);b.setAttribute('aria-selected',on?'true':'false')}window.scrollTo(0,0)}
function toggleZh(){const on=document.body.classList.toggle('show-zh');const b=document.getElementById('zhToggle');b.textContent=on?'中文 ON':'中文 OFF';b.setAttribute('aria-pressed',String(on))}
/* Audio */
let speakingButton=null,speakingUtterance=null;
function stopAudio(){if(window.speechSynthesis)speechSynthesis.cancel();if(speakingButton){speakingButton.classList.remove('speaking');speakingButton.setAttribute('aria-pressed','false')}speakingButton=null;speakingUtterance=null}
function speak(text,button){if(!('speechSynthesis' in window))return;if(speakingButton===button){stopAudio();return}stopAudio();const u=new SpeechSynthesisUtterance(text.replace(/_{2,}/g,' blank '));u.lang='en-US';u.rate=.88;const v=speechSynthesis.getVoices();u.voice=v.find(x=>x.lang==='en-US')||v.find(x=>x.lang.startsWith('en'))||null;speakingButton=button;speakingUtterance=u;button.classList.add('speaking');button.setAttribute('aria-pressed','true');const done=()=>{if(speakingUtterance===u){button.classList.remove('speaking');button.setAttribute('aria-pressed','false');speakingButton=null;speakingUtterance=null}};u.onend=done;u.onerror=done;speechSynthesis.speak(u)}
function audioCard(en,cls=''){return '<button type="button" class="audio-card '+cls+'" data-english="'+esc(en)+'" aria-pressed="false" title="點擊朗讀英文；再點一次停止" onclick="speak(this.dataset.english,this)">'+esc(en)+'</button>'}

function toggleAns(b,force){const show=typeof force==='boolean'?force:!b.classList.contains('shown');b.classList.toggle('shown',show);const it=b.closest('.ditem');if(it)it.classList.toggle('shown',show);b.textContent=show?b.dataset.a:'看答案'}
function showAllDrill(v){document.querySelectorAll('#drill .ans').forEach(b=>toggleAns(b,v))}
document.getElementById('drill-root').innerHTML=DATA.drills.map(d=>drillCard('d-'+d.q,'<span class="qtag">Q'+d.q+'</span>'+(d.title?esc(d.title):''),d.bank,d.items)).join('')+(DATA.combined?drillCard('d-all','<span class="qtag">ALL</span>十個選項綜合練習',DATA.combined.bank,DATA.combined.items):'');

/* ---------- Practice tab ---------- */
const Q=DATA.questions;const state={};
function passageCard(p){return '<div class="card passage-card" id="passage-'+p.id+'"><h2>'+esc(p.title)+'</h2><p class="small">'+esc(p.label)+'</p><div class="passage">'+p.article+'</div><div class="pzh zh">'+p.zh.map(z=>'<p>'+blank(z)+'</p>').join('')+'</div></div>'}
function questionCard(q){
 const letters=q.letters||L;
 const choices=q.options.map((o,i)=>'<button type="button" class="choice" onclick="answer('+q.num+','+i+')"><strong>'+letters[i]+'</strong>'+esc(o)+'</button>').join('');
 const others=(q.others||q.options.map((_,i)=>i)).filter(i=>i!==q.answer&&q.reasons[i]);
 const other=others.length?'<details class="other-choices"><summary>其他選項為什麼不對</summary><ul>'+others.map(i=>'<li><b>'+letters[i]+' · '+esc(q.options[i])+'</b>：'+esc(q.reasons[i])+'</li>').join('')+'</ul></details>':'';
 const g=q.grammar;const grammar=g?'<details class="grammar-extra"><summary>'+esc(g.title)+'</summary><div class="grammar-content"><p>'+esc(g.concept)+'</p><p>'+esc(g.rule)+'</p><p><strong>對照例句：</strong>'+esc(g.example)+'</p><p><strong>自己試：</strong>'+esc(g.practice)+'</p><p><strong>參考答案：</strong>'+esc(g.answer)+'</p></div></details>':'';
 const take=q.takeaway?'<div class="takeaway"><strong>帶走一句</strong>'+'<button type="button" class="audio-card takeaway-phrase" data-english="'+esc(q.takeaway[0])+'" onclick="speak(this.dataset.english,this)"><b>'+esc(q.takeaway[0])+'</b><span class="note-meaning">｜'+esc(q.takeaway[1])+'</span></button></div>':'';
 return '<div class="question-card" id="q-'+q.num+'"><div class="question-head"><span class="question-num">第 '+q.num+' 題</span><span class="small">'+esc(q.qtype)+'</span></div>'+
  '<div class="question-sentence-row"><div class="question-sentence">'+blank(q.sentence)+'</div><button type="button" class="question-audio" aria-label="朗讀題目" aria-pressed="false" onclick="speak(Q.find(x=>x.num==='+q.num+').sentence,this)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg></button></div>'+
  '<p class="question-translation zh">'+blank(q.hintZh)+'</p><div class="choices'+(q.options.length>4?' wb':'')+'">'+choices+'</div>'+
  '<div class="hint-row"><button type="button" class="hint-btn" id="hb-'+q.num+'" onclick="nextHint('+q.num+')">提示（0 / '+q.hints.length+'）</button><button type="button" class="reveal-btn" id="reveal-'+q.num+'" aria-expanded="false" onclick="toggleExplain('+q.num+')">查看解析</button></div><ul class="hints" id="hints-'+q.num+'"></ul>'+
  '<div class="answer-box" id="answer-'+q.num+'"><div class="answer-status" id="status-'+q.num+'"></div><p class="picked-reason" id="picked-'+q.num+'"></p><strong>答案 '+letters[q.answer]+'：'+esc(q.options[q.answer])+'</strong><p class="explain-main">'+esc(q.explain)+'</p>'+(q.trap?'<div class="trap-line">'+esc(q.trap)+'</div>':'')+(q.formula?'<div class="formula-line"><b>'+esc(q.formula[0])+'</b>　'+esc(q.formula[1])+'</div>':'')+other+grammar+take+'</div></div>'}
function nextHint(n){const q=Q.find(x=>x.num===n),ul=document.getElementById('hints-'+n),k=ul.children.length;if(k>=q.hints.length)return;ul.insertAdjacentHTML('beforeend','<li><b>提示 '+(k+1)+'</b>'+blank(q.hints[k])+'</li>');document.getElementById('hb-'+n).textContent=k+1<q.hints.length?'提示（'+(k+1)+' / '+q.hints.length+'）':'提示已用完'}
function openExplain(n){document.getElementById('answer-'+n).classList.add('visible');const b=document.getElementById('reveal-'+n);b.textContent='收回解析';b.setAttribute('aria-expanded','true')}
function toggleExplain(n){const el=document.getElementById('answer-'+n),show=el.classList.toggle('visible'),b=document.getElementById('reveal-'+n);b.textContent=show?'收回解析':'查看解析';b.setAttribute('aria-expanded',String(show));if(show&&!state[n])document.getElementById('dot-'+n).classList.add('viewed')}
function answer(n,i){if(state[n])return;const q=Q.find(x=>x.num===n);const ok=i===q.answer;state[n]={ok};const letters=q.letters||L;
 document.querySelectorAll('#q-'+n+' .choice').forEach((el,k)=>{if(k===q.answer)el.classList.add('correct');else if(k===i)el.classList.add('wrong')});
 const dot=document.getElementById('dot-'+n);dot.classList.remove('viewed');dot.classList.add(ok?'correct':'wrong');
 const st=document.getElementById('status-'+n);st.textContent=ok?'答對了':'答錯了，你選了 '+letters[i]+' · '+q.options[i];st.classList.toggle('incorrect',!ok);
 document.getElementById('picked-'+n).textContent=ok?'':(q.reasons[i]||'');openExplain(n);updateScore();updateFinish()}
function clearQ(n){delete state[n];const c=document.getElementById('q-'+n);c.querySelectorAll('.choice').forEach(b=>b.classList.remove('correct','wrong'));c.querySelector('.answer-box').classList.remove('visible');const b=document.getElementById('reveal-'+n);b.textContent='查看解析';b.setAttribute('aria-expanded','false');document.getElementById('status-'+n).textContent='';document.getElementById('picked-'+n).textContent='';document.getElementById('hints-'+n).innerHTML='';const q=Q.find(x=>x.num===n);document.getElementById('hb-'+n).textContent='提示（0 / '+q.hints.length+'）';c.querySelectorAll('details').forEach(d=>d.open=false);document.getElementById('dot-'+n).classList.remove('correct','wrong','viewed')}
function updateScore(){const g=Object.values(state),r=g.filter(x=>x.ok).length;document.getElementById('scoreVal').textContent=g.length+' / '+Q.length;document.getElementById('accuracyVal').textContent=g.length?Math.round(r/g.length*100)+'%':'—';document.getElementById('barFill').style.width=(g.length/Q.length*100)+'%'}
function resetPractice(){stopAudio();Q.forEach(q=>clearQ(q.num));updateScore();updateFinish();document.getElementById('practice').scrollIntoView()}
function redoWrong(){stopAudio();const w=Q.filter(q=>state[q.num]&&!state[q.num].ok).map(q=>q.num);w.forEach(clearQ);updateScore();updateFinish();if(w.length)goQ(w[0])}
function goQ(n){document.getElementById('q-'+n).scrollIntoView({behavior:'smooth',block:'start'})}
function updateFinish(){const el=document.getElementById('finishCard');if(Object.keys(state).length<Q.length){el.classList.remove('visible');el.innerHTML='';return}
 const w=Q.filter(q=>!state[q.num].ok).map(q=>q.num),r=Q.length-w.length;
 el.innerHTML='<h2>本課練習完成：答對 '+r+' / '+Q.length+'</h2>'+(w.length?'<p>以下題目答錯，建議重做一次並重讀解析：</p><div class="wrong-links">'+w.map(n=>'<button type="button" onclick="goQ('+n+')">第 '+n+' 題</button>').join('')+'</div><div class="finish-actions"><button type="button" class="primary" onclick="redoWrong()">只重做錯題</button><button type="button" onclick="resetPractice()">全部重做</button></div>':'<p>全部答對。到「單字練習」把每題的句子再做一次。</p><div class="finish-actions"><button type="button" onclick="resetPractice()">全部重做</button></div>');el.classList.add('visible')}
document.getElementById('practice-root').innerHTML=DATA.groups.map(g=>'<div class="practice-group"><h2>'+esc(g.title)+'</h2>'+(g.passage?passageCard(DATA.passages.find(p=>p.id===g.passage)):'')+Q.filter(q=>g.nums.includes(q.num)).map(questionCard).join('')+'</div>').join('');
document.getElementById('progressGrid').innerHTML=Q.map(q=>'<button type="button" class="progress-dot" id="dot-'+q.num+'" aria-label="前往第 '+q.num+' 題" onclick="goQ('+q.num+')">'+q.num+'</button>').join('');
updateScore();
</script>
</body></html>
